[project]
name = "silent-static"
version = "0.1.0"
description = "Randomized creative codename and brief generator for the PhoneixHovaN portfolio."
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
silent-static = "silent_static.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["silent_static*"]
